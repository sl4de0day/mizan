<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mizan · Yerel yönetim</title>

<script>document.documentElement.setAttribute('data-theme',(function(){try{return localStorage.getItem('mizan-tema')==='dark'?'dark':'light'}catch(e){return 'light'}})());</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fjalla+One&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/stil.css" />
<style>
  body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  a { color:inherit; }

  nav { position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between; padding:10px 18px;
    background:color-mix(in srgb, var(--paper) 86%, transparent); -webkit-backdrop-filter:saturate(1.4) blur(8px); backdrop-filter:saturate(1.4) blur(8px); border-bottom:1px solid var(--line); }
  .wordmark { font-family:var(--serif); font-weight:700; font-size:1.1rem; display:inline-flex; align-items:center; gap:8px; text-decoration:none; color:var(--ink); }

  .nav-r { display:flex; gap:8px; align-items:center; min-width:0; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  .nav-r::-webkit-scrollbar { display:none; }
  .nav-r a { font-size:.8rem; font-weight:700; text-decoration:none; color:var(--petrol-ink); padding:6px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); }
  .theme-tgl { width:32px; height:32px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink-2); font-size:.9rem; cursor:pointer; }

  .wrap { max-width:760px; margin:0 auto; padding:18px 18px 60px; }
  .back { display:inline-block; font-size:.82rem; color:var(--muted); text-decoration:none; margin-bottom:14px; }
  .back:hover { color:var(--petrol); }
  h1 { font-family:var(--serif); font-size:1.7rem; margin:0 0 6px; }
  .lede { color:var(--muted); font-size:.92rem; margin:0 0 18px; }
  .ara { display:flex; gap:10px; align-items:end; margin-bottom:18px; flex-wrap:wrap; }
  .fld label { display:block; font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); margin-bottom:4px; }
  select, input[type=search] { font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  input[type=search] { min-width:220px; }
  .ozet-satir { display:flex; flex-wrap:wrap; gap:18px; margin-bottom:16px; }
  .ozet-item .n { font-family:var(--serif); font-size:1.3rem; font-weight:600; }
  .ozet-item .l { font-size:.74rem; color:var(--muted); }
  .grup-baslik { font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:16px 0 6px; }
  .grup-baslik:first-of-type { margin-top:4px; }
  .prow { display:grid; grid-template-columns:110px 1fr 70px; align-items:center; gap:10px; padding:7px 0; }
  .prow .ad { font-size:.88rem; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .prow .n { font-size:.78rem; color:var(--muted); text-align:right; font-variant-numeric:tabular-nums; }
  .kapsam-not { font-size:.78rem; color:var(--muted); margin-top:16px; padding-top:14px; border-top:1px solid var(--line); }
  #empty { color:var(--muted); font-size:.9rem; }

  .kararlar-card { margin-top:16px; }
  .krow { padding:10px 0; border-top:1px solid var(--line-2); }
  .krow:first-child { border-top:0; }
  .kbaslik { display:flex; align-items:center; gap:7px; margin-bottom:4px; flex-wrap:wrap; }
  .kbaslik b { font-size:.86rem; color:var(--ink); }
  .kbelge { font-size:.68rem; color:var(--muted); }
  .ktur { font-size:.58rem; font-weight:700; letter-spacing:.03em; padding:3px 7px; border-radius:5px; background:var(--petrol-wash); color:var(--petrol-ink); white-space:nowrap; }
  .ktur.coklu { background:var(--petrol); color:var(--card); }
  .kalinti { font-size:.82rem; color:var(--ink-2); line-height:1.45; }
  .kkonu { font-size:.78rem; color:var(--ink); font-weight:600; margin-bottom:2px; }
  .kkaynak { display:inline-block; font-size:.72rem; font-weight:600; color:var(--petrol-ink); text-decoration:none; margin-top:5px; }
  .kkaynak:hover { text-decoration:underline; }
  .kformat { font-size:.68rem; color:var(--muted); font-weight:600; margin-left:4px; }
</style>
</head>
<body>
<nav>
  <span class="wordmark" aria-hidden="true"></span>
  <div class="nav-r"><button class="theme-tgl" id="themeTgl" aria-label="tema">◐</button></div>
</nav>

<div class="wrap">
  <a class="back" href="/">← Ana sayfa</a>
  <h1>Yerel yönetim</h1>
  <p class="lede" id="ledeMetin">Belediyelerin <b>meclis parti kompozisyonu</b> ve 2024 yerel seçimi sonrası <b>meclis kararları</b> — kim nasıl oy verdi bilgisi yok, yalnız kararın kendi oybirliği/oyçokluğu beyanı var.</p>

  <div class="ara">
    <div class="fld">
      <label for="belediyeSec">Belediye</label>
      <select id="belediyeSec"><option value="">Yükleniyor…</option></select>
    </div>
    <div class="fld">
      <label for="araGirdi">Kararlarda ara</label>
      <input type="search" id="araGirdi" placeholder="ör. imar planı, bütçe…" />
    </div>
  </div>

  <div id="govde"><div id="empty">Yükleniyor…</div></div>
  <div class="card kararlar-card" id="kararlarCard" hidden>
    <div class="ttl" id="kararlarBaslik">Son kararlar</div>
    <div id="kararlarGovde"></div>
    <div class="kapsam-not" id="kararlarNot"></div>
  </div>
</div>

<script type="module">
import { partiRenk, nf, bar, sayfaCanlandir, temaDegistir } from './ortak.js';
sayfaCanlandir();
const $ = (id) => document.getElementById(id);

$('themeTgl').addEventListener('click', temaDegistir);

const params = new URLSearchParams(location.search);
let BELEDIYE = params.get('belediye') || '';
let ARA_TERIM = '';
let araZamanlayici = null;

async function meclisCek(belediye) {
  const u = new URL('/api/ozet/yerel-meclis', location.origin);
  if (belediye) u.searchParams.set('belediye', belediye);
  return (await fetch(u)).json();
}

function renderMeclis(j) {
  const govde = $('govde');
  if (!j.success || !j.meclis) {
    govde.innerHTML = `<div id="empty">${j.sebep || 'Yerel yönetim verisi bulunamadı.'}</div>`;
    return;
  }
  const m = j.meclis;
  const max = Math.max(...m.partiler.map((p) => p.n), 1);
  const satirlar = m.partiler.map((p) => `
    <div class="prow">
      <div class="ad">${p.parti}</div>
      ${bar(p.n, max, partiRenk(p.parti))}
      <div class="n">${nf(p.n)}${p.oran != null ? ` · %${p.oran.toLocaleString('tr-TR')}` : ''}</div>
    </div>
  `).join('');
  govde.innerHTML = `
    <div class="card">
      <div class="ttl">${m.belediye} Büyükşehir Belediye Meclisi</div>
      <div class="ozet-satir">
        <div class="ozet-item"><div class="n">${nf(m.toplam_uye)}</div><div class="l">Toplam üye</div></div>
      </div>
      ${m.toplam_uye ? satirlar : '<div id="empty">Üye listesi bu belediye için mevcut değil.</div>'}

      <div class="kapsam-not"><b>Yüzdeler MECLİS ÜYE SAYISI (sandalye) dağılımıdır — 2024 yerel seçiminde partinin aldığı oy yüzdesi değildir, o veri bu sitede yok.</b> ${m.kapsam_notu}</div>
    </div>
  `;
}

async function kararlarCek(belediye, terim) {
  const u = new URL('/api/ozet/yerel-karar-ara', location.origin);
  u.searchParams.set('q', terim || belediye || 'karar');
  if (belediye) u.searchParams.set('belediye', belediye);
  u.searchParams.set('limit', '10');
  return (await fetch(u)).json();
}

function renderKararlar(j, terim) {
  const kart = $('kararlarCard'), govde = $('kararlarGovde'), not = $('kararlarNot'), baslik = $('kararlarBaslik');
  if (!j || !j.success) { kart.hidden = true; return; }
  kart.hidden = false;
  baslik.textContent = terim ? `“${terim}” için kararlar` : 'Son kararlar';
  if (!j.kayitlar.length) {
    govde.innerHTML = `<div id="empty">${terim ? `“${terim}” için karar bulunamadı.` : 'Karar bulunamadı.'}</div>`;
    not.textContent = j.kapsam_notu || '';
    return;
  }
  const oylamaEtiket = { oybirlik: 'OYBİRLİĞİ', oycoklugu: 'OYÇOKLUĞU' };
  govde.innerHTML = j.kayitlar.map((r) => `
    <div class="krow">
      <div class="kbaslik"><b>${r.belediye}</b><span class="kbelge">${r.tarih}${r.karar_no ? ` · Karar No ${r.karar_no}` : ''}</span>
        ${r.oylama_sonucu ? `<span class="ktur${r.oylama_sonucu === 'oycoklugu' ? ' coklu' : ''}">${oylamaEtiket[r.oylama_sonucu]}</span>` : ''}</div>
      ${r.konu ? `<div class="kkonu">${r.konu}</div>` : ''}
      <div class="kalinti">${r.alinti ? `“${r.alinti}”` : (r.konu ? '' : 'Alıntı yok.')}</div>
      <a class="kkaynak" href="${r.kaynak_url}" target="_blank" rel="noopener">Kaynağa git →</a>${
        /\.docx?(\?|$)/i.test(r.kaynak_url || '')
          ? `<span class="kformat" title="Bu belge Word (.docx) formatındadır — tarayıcıda değil bir kelime işlemcide (Word, Google Dokümanlar vb.) açılır">· .docx dosyası</span>`
          : ''
      }
    </div>
  `).join('');
  not.textContent = j.kapsam_notu || '';
}

let meclisKey = '', kararlarKey = '';
async function meclisYenile() {
  const key = BELEDIYE;
  meclisKey = key;
  const meclis = await meclisCek(BELEDIYE);
  if (key !== meclisKey) return;
  renderMeclis(meclis);
}
async function kararlarYenile() {
  const key = BELEDIYE + '|' + ARA_TERIM;
  kararlarKey = key;
  const kararlar = await kararlarCek(BELEDIYE, ARA_TERIM);
  if (key !== kararlarKey) return;
  renderKararlar(kararlar, ARA_TERIM);
}
function yenile() {
  void meclisYenile();
  void kararlarYenile();
}

async function baslat() {
  const sec = $('belediyeSec');
  const meclisIlk = await meclisCek(BELEDIYE);
  const belediyeler = meclisIlk.belediyeler?.length ? meclisIlk.belediyeler : ['İstanbul', 'Ankara', 'İzmir', 'Bursa', 'Konya', 'Diyarbakır'];
  BELEDIYE = BELEDIYE && belediyeler.includes(BELEDIYE) ? BELEDIYE : belediyeler[0];
  sec.innerHTML = belediyeler.map((b) => `<option value="${b}">${b}</option>`).join('');
  $('ledeMetin').innerHTML = `<b>${belediyeler.length}</b> belediyenin <b>meclis parti kompozisyonu</b> ve 2024 yerel seçimi sonrası <b>meclis kararları</b> — kim nasıl oy verdi bilgisi yok, yalnız kararın kendi oybirliği/oyçokluğu beyanı var.`;
  sec.value = BELEDIYE;
  if (BELEDIYE === meclisIlk.meclis?.belediye) renderMeclis(meclisIlk); else void meclisYenile();
  void kararlarYenile();

  sec.addEventListener('change', () => {
    BELEDIYE = sec.value;
    const u = new URL(location.href);
    u.searchParams.set('belediye', BELEDIYE);
    history.replaceState(null, '', u);
    yenile();
  });
  $('araGirdi').addEventListener('input', (e) => {
    clearTimeout(araZamanlayici);
    araZamanlayici = setTimeout(() => {
      const yeni = e.target.value.trim();
      if (yeni.length && yeni.length < 3) return;
      ARA_TERIM = yeni;
      void kararlarYenile();
    }, 350);
  });
}

baslat();
</script>
</body>
</html>
